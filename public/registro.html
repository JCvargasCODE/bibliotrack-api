<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiblioTrack - Registro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#0f172a] text-slate-200 min-h-screen flex items-center justify-center p-4" style="font-family: 'Inter', sans-serif;">

    <div class="bg-[#1e293b] w-full max-w-md p-8 rounded-xl shadow-2xl border border-slate-800">
        <div class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-indigo-500 tracking-tight">BiblioTrack</h1>
            <p class="text-slate-400 mt-2 text-sm">Crea tu cuenta de estudiante</p>
        </div>

        <div id="errorAlert" class="hidden mb-4 p-3 bg-red-500/20 border border-red-500/50 text-red-200 text-sm rounded-lg text-center"></div>
        <div id="successAlert" class="hidden mb-4 p-3 bg-emerald-500/20 border border-emerald-500/50 text-emerald-200 text-sm rounded-lg text-center"></div>

        <form id="registerForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Nombre Completo</label>
                <input type="text" id="nombre" required placeholder="Juan Carlos" class="w-full px-4 py-2 bg-[#0f172a] border border-slate-700 rounded-lg text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Email</label>
                <input type="email" id="email" required placeholder="tu@email.com" class="w-full px-4 py-2 bg-[#0f172a] border border-slate-700 rounded-lg text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-2 bg-[#0f172a] border border-slate-700 rounded-lg text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500">
            </div>
            <button type="submit" id="btnSubmit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg shadow-lg transition-all">
                Crear Cuenta
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-400">
            ¿Ya tienes cuenta? <a href="index.html" class="text-indigo-400 hover:underline">Inicia sesión aquí</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorAlert = document.getElementById('errorAlert');
            const successAlert = document.getElementById('successAlert');
            const btnSubmit = document.getElementById('btnSubmit');

            btnSubmit.disabled = true;
            errorAlert.classList.add('hidden');

            try {
                const response = await fetch('https://bibliotrack-api.onrender.com/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nombre: document.getElementById('nombre').value,
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    successAlert.innerText = "¡Registro exitoso! Redireccionando al login...";
                    successAlert.classList.remove('hidden');
                    setTimeout(() => window.location.href = 'index.html', 2000);
                } else {
                    errorAlert.innerText = data.error || 'Error al registrar el usuario.';
                    errorAlert.classList.remove('hidden');
                    btnSubmit.disabled = false;
                }
            } catch (error) {
                errorAlert.innerText = 'Error al conectar con el servidor.';
                errorAlert.classList.remove('hidden');
                btnSubmit.disabled = false;
            }
        });
    </script>
</body>
</html>
