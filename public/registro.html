<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiblioTrack - Registro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#0f172a] text-slate-200 min-h-screen flex items-center justify-center p-4" style="font-family: 'Inter', sans-serif;">

    <div class="bg-[#1e293b] w-full max-w-md p-8 rounded-xl shadow-2xl border border-slate-800">
        <div class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-indigo-500 tracking-tight">Crear Cuenta</h1>
            <p class="text-slate-400 mt-2 text-sm">Regístrate para acceder al sistema de préstamos</p>
        </div>

        <div id="alert" class="hidden mb-4 p-3 rounded-lg text-sm text-center"></div>

        <form id="registerForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Nombre Completo</label>
                <input type="text" id="nombre" required placeholder="Juan Carlos" class="w-full px-4 py-2 bg-[#0f172a] border border-slate-700 rounded-lg text-slate-100 focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Email</label>
                <input type="email" id="email" required placeholder="tu@upds.edu.bo" class="w-full px-4 py-2 bg-[#0f172a] border border-slate-700 rounded-lg text-slate-100 focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-2 bg-[#0f172a] border border-slate-700 rounded-lg text-slate-100 focus:outline-none focus:border-indigo-500">
            </div>
            <button type="submit" id="btnSubmit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg shadow-lg transition-all">
                Registrarse
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-400">
            ¿Ya tienes cuenta? <a href="index.html" class="text-indigo-400 hover:underline">Inicia sesión aquí</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('alert');
            
            try {
                // 🔥 Asegúrate de que esta ruta coincida con tu endpoint real de registro (ej. /api/auth/register o /api/usuarios)
                const res = await fetch('https://bibliotrack-api.onrender.com/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nombre: document.getElementById('nombre').value,
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value
                    })
                });
                const data = await res.json();

                if (res.ok) {
                    alertBox.className = "mb-4 p-3 bg-green-500/20 border border-green-500/50 text-green-200 text-sm rounded-lg text-center";
                    alertBox.innerText = "¡Usuario registrado con éxito! Redireccionando...";
                    setTimeout(() => window.location.href = 'index.html', 2000);
                } else {
                    alertBox.className = "mb-4 p-3 bg-red-500/20 border border-red-500/50 text-red-200 text-sm rounded-lg text-center";
                    alertBox.innerText = data.error || "Error al registrar.";
                }
            } catch (err) {
                alertBox.className = "mb-4 p-3 bg-red-500/20 border border-red-500/50 text-red-200 text-sm rounded-lg text-center";
                alertBox.innerText = "Error de conexión.";
            }
        });
    </script>
</body>
</html>
