<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiblioTrack - Iniciar Sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-200 min-h-screen flex items-center justify-center p-4">

    <div class="bg-[#1e293b] w-full max-w-md p-8 rounded-xl shadow-2xl border border-slate-800">
        <div class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-indigo-500 tracking-tight">BiblioTrack</h1>
            <p class="text-slate-400 mt-2 text-sm">Inicia sesión para gestionar tus préstamos de biblioteca</p>
        </div>

        <div id="errorAlert" class="hidden mb-4 p-3 bg-red-500/20 border border-red-500/50 text-red-200 text-sm rounded-lg text-center">
            Credenciales incorrectas. Intenta de nuevo.
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label for="email" class="block text-sm font-medium text-slate-300 mb-1">Email</label>
                <input type="email" id="email" name="email" placeholder="tu@email.com" required
                    class="w-full px-4 py-2.5 bg-[#0f172a] border border-slate-700 rounded-lg text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-slate-300 mb-1">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required
                    class="w-full px-4 py-2.5 bg-[#0f172a] border border-slate-700 rounded-lg text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors">
            </div>

            <button type="submit" id="btnSubmit"
                class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg shadow-lg hover:shadow-indigo-500/20 transition-all focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-[#1e293b]">
                Iniciar sesión
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-400">
            ¿Sin cuenta? <span class="text-indigo-400 hover:underline cursor-pointer">Regístrate aquí</span>
        </div>
    </div>

    <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault(); // Evita que la página se recargue sola

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorAlert = document.getElementById('errorAlert');
        const btnSubmit = document.getElementById('btnSubmit');

        // Feedback visual: deshabilitar botón mientras procesa
        btnSubmit.disabled = true;
        btnSubmit.innerText = 'Procesando...';
        errorAlert.classList.add('hidden');

        try {
            // 🔥 Petición Fetch a tu API en Render
            const response = await fetch('https://bibliotrack-api.onrender.com/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (response.ok) {
                // 1. Guardamos el Token JWT en el LocalStorage del navegador
                localStorage.setItem('token', data.token);
                
                // 2. 🔥 ¡REDIRECCIÓN REAL AUTOMÁTICA!
                // Al estar en la misma carpeta public, esto te mandará directo a la otra pantalla
                window.location.href = 'dashboard.html'; 
            } else {
                // Si las credenciales están mal o hay error 500, mostramos el mensaje de tu API
                errorAlert.innerText = data.error || 'Credenciales incorrectas o error en el servidor.';
                errorAlert.classList.remove('hidden');
            }
        } catch (error) {
            console.error('Error en el fetch:', error);
            errorAlert.innerText = 'No se pudo conectar con el servidor de Render.';
            errorAlert.classList.remove('hidden');
        } finally {
            // Restaurar el botón para que se pueda volver a intentar
            btnSubmit.disabled = false;
            btnSubmit.innerText = 'Iniciar sesión';
        }
    });
</script>
</body>
</html>
